# references:
#
# On the dynamics of a shock-bubble interaction, Quirk and Karni
# Journal of Fluid Mechanics , Volume 318 , 10 July 1996 , pp. 129 - 163
# DOI: https://doi.org/10.1017/S0022112096007069
#
# A Mach 1.22 planar shock wave moving in air to a bubble containing helium
#
# Initial conditions can be cross-check using python script
# app/godunov_five_eq/tools/moving_shock.py
#
# Experimental data:
# J. Haas, B. Sturtevant, Interaction of weak shock waves with cylindrical and spherical gas inhomogeneities, J. Fluid Mech. 181 (1987) 41–76
# DOI: https://doi.org/10.1017/S0022112087002003

[run]
dimension=3
tEnd=0.1
nStepmax=10000

# number of materials
nmat=2

# noutput equals -1 means we dump data at every time steps
nOutput=10

[amr]
level_min=1
level_max=3

use_block_data=yes
bx=8
by=8
bz=8

# amr refine criterion use at init condition
# possible value: ALWAYS_REFINE, GEOMETRIC, SAME_AS_REGULAR_DYNAMICS
refine_criterion_at_init=SAME_AS_REGULAR_DYNAMICS

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

# refine criterion (used during regular dynamics)
# example parameter for using LOHNER_UNSPLIT criterion
refine_criterion=LOHNER_UNSPLIT
epsilon_refine=0.1
epsilon_coarsen=0.0125
epsilon_lohner=0.02

# example parameter for using LOHNER_UNSPLIT criterion
#refine_criterion=SIMPLE_GRADIENT
#epsilon_refine=0.1
#epsilon_coarsen=0.01

# p4est connectivity type
connectivity=brick

# control MPI load balancing (number of time steps between two
# consecutive load balancing)
load_balancing_frequency=20

# control AMR cycle frequency (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=10

#
# when using two AMR refinement criterion (one for init conditions,
# one of the rest of the simulation run), we may want to disable the first amr cycle
# to smooth the transition between the two AMR criterion.
#
disable_first_amr_cycle=yes

# Use RK2_SSP when interface capturing is activated
# time_integrator=RK2_SSP

variable_used_to_compute_refine_criterion=alpha_rho_0

[p4est_connectivity]
nbrick_x=4
nbrick_y=1
nbrick_z=1

periodic_x=0
periodic_y=0
periodic_z=0

[mesh]
xmin=0.0
ymin=0.0
zmin=0.0

scaling_factor=0.5

boundary_type_xmin=ZERO_GRADIENT
boundary_type_xmax=ZERO_GRADIENT

boundary_type_ymin=WALL
boundary_type_ymax=WALL

boundary_type_zmin=WALL
boundary_type_zmax=WALL

[hydro]
cfl=0.5
slope_type=2
problem=shock_bubble
riemann=HLLC

[shock_bubble]
num_bubbles=1
x_front=0.2
bubble_x=0.6
bubble_y=0.25
bubble_z=0.25
bubble_radius=0.1

[material0]
name=air
mg_eos_name=MG_IDEAL_GAS

[material0_mie_gruneisen_ig]
gamma=1.4
pinf=0

[material1]
name=helium
mg_eos_name=MG_IDEAL_GAS

[material1_mie_gruneisen_ig]
gamma=1.67
pinf=0.0

# air - post-shock
[region0]
name=post-shock
alpha0=1.0
alpha_rho=1.3763639726280747,0.0
p=1.5698
u=0.39472860192156445
v=0.0
w=0.0

# air - pre-shock
[region1]
name=pre-shock
alpha0=1.0
alpha_rho=1.0,0.0
p=1.0
u=0.0
v=0.0
w=0.0

# helium - bubble
[region2]
name=bubble
alpha0=0.0
alpha_rho=0.0,0.1382156740413687
p=1.0
u=0.0
v=0.0
w=0.0

[output]
outputDir=./
outputPrefix=test_shock_bubble_air_helium_3d
outputVtkAscii=false
write_variables=rho_mix,alpha_rho_0,alpha_rho_1,alpha_0,rho_vx,rho_vy,e_tot,rho_mix_schlieren,thermal_pressure
write_mesh_info=yes
write_iOct=no
hdf5_enabled=yes
enable_writing_leaf_data=no
write_conformal_status=no
schlieren_scaling=SQRT
