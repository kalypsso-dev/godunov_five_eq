# This is a shock-bubble test case.
#
# reference: see example 9 in reference
# High-order finite volume method for solving compressible multicomponent flows with
# Mie–Grüneisen equation of state. F. Zheng and J. Qiu, Computers & Fluids, Volume 284, 2024,
# 106424, ISSN 0045-7930.
# https://doi.org/10.1016/j.compfluid.2024.106424

[run]
dimension=2
#tEnd=0.000085
tEnd=0.000030
nStepmax=100000

# number of materials
nmat=2

# noutput equals -1 means we dump data at every time steps
nOutput=10

[amr]
level_min=2
level_max=6

use_block_data=yes
bx=8
by=8

# amr refine criterion use at init condition
# possible value: ALWAYS_REFINE, GEOMETRIC, SAME_AS_REGULAR_DYNAMICS
refine_criterion_at_init=SAME_AS_REGULAR_DYNAMICS

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

# refine criterion (used during regular dynamics)
# example parameter for using LOHNER_UNSPLIT criterion
refine_criterion=LOHNER_UNSPLIT
epsilon_refine=0.1
epsilon_coarsen=0.0125
epsilon_lohner=0.02

# example parameter for using LOHNER_UNSPLIT criterion
#refine_criterion=SIMPLE_GRADIENT
#epsilon_refine=0.1
#epsilon_coarsen=0.01

# p4est connectivity type
connectivity=brick

# control MPI load balancing (number of time steps between two
# consecutive load balancing)
load_balancing_frequency=20

# control AMR cycle frequency (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=10

#
# when using two AMR refinement criterion (one for init conditions,
# one of the rest of the simulation run), we may want to disable the first amr cycle
# to smooth the transition between the two AMR criterion.
#
disable_first_amr_cycle=yes

# Use RK2_SSP when interface capturing is activated
# time_integrator=RK2_SSP

variable_used_to_compute_refine_criterion=rho0,thermal_pressure

[p4est_connectivity]
nbrick_x=1
nbrick_y=1

periodic_x=0
periodic_y=0

[mesh]
xmin=0.0
ymin=0.0

scaling_factor=1.0

boundary_type_xmin=ZERO_GRADIENT
boundary_type_xmax=ZERO_GRADIENT

boundary_type_ymin=WALL
boundary_type_ymax=WALL

[hydro]
cfl=0.3
slope_type=2
problem=shock_bubble
riemann=HLLC

[smooth_interface_function]
enabled=no
surface_tension_enabled=no
curvature_filter_iterations=10
output_variables=vol_frac,sif,normal_vector

[THINC]
enabled=yes
beta=1.5
epsilon=1e-3

[shock_bubble]
num_bubbles=1
x_front=0.3
bubble_x=0.55
bubble_y=0.5
bubble_radius=0.15

[material0]
name=molybdenum
mg_eos_name=MG_SHOCKWAVE2

[material0_mie_gruneisen_sw2]
rho0=9961.0
Gamma0=2.56
c0=4770.0
s=1.43
alpha=1.0
e0=0.0
p0=0.0

[material1]
name=MORB
mg_eos_name=MG_SHOCKWAVE2

[material1_mie_gruneisen_sw2]
rho0=2660.0
Gamma0=1.18
c0=2100.0
s=1.68
alpha=1.0
e0=0.0
p0=0.0

# molybdenum - post-shock
[region0]
name=post-shock
phi_rho=11041.988958,0.011042
p=3.0e10
u=543.0
v=0.0
phi0=0.999999

# molybdenum - pre-shock
[region1]
name=pre-shock
phi_rho=9960.990039,0.009961
p=1.0e5
u=0.0
v=0.0
phi0=0.999999

# MORB - bubble
[region2]
name=bubble
phi_rho=0.00226,2259.99774
p=1.0e5
u=0.0
v=0.0
phi0=1e-6

[output]
outputDir=./
outputPrefix=test_shock_bubble_molybdenum_MORB_2d
outputVtkAscii=false
write_variables=rho_mix,rho0,rho1,phi,rho_vx,rho_vy,e_tot,rho_mix_schlieren,thermal_pressure
write_mesh_info=yes
write_iOct=no
hdf5_enabled=yes
enable_writing_leaf_data=no
write_conformal_status=no
schlieren_scaling=SQRT
