#
# This test case soves a Riemann problem with LX17 on both sides.
# LX17 is an explosive modeled with JWL EOS.
#
# Original references:
#
# - Adaptive Osher-type scheme for the Euler equations with highly nonlinear equations of state,
# Bok Jik Lee, Eleuterio F. Toro, Cristóbal E. Castro, Nikolaos Nikiforakis,
# Journal of Computational Physics, Volume 246, 2013, Pages 165-183,
# https://doi.org/10.1016/j.jcp.2013.03.046
#
# - A method for compressible multimaterial flows with condensed phase explosive detonation
# and airblast on unstructured grids. Matthew A. Price, Vinh-Tan Nguyen, Oubay Hassan, Ken Morgan,
# Computers & Fluids, Volume 111, 2015, Pages 76-90,
# https://doi.org/10.1016/j.compfluid.2015.01.006
#

[run]
dimension=2
tEnd=0.000020
nStepmax=100000

# number of materials
nmat=2

# noutput equals -1 means we dump data at every time steps
nOutput=10

[amr]
level_min=2
level_max=5

use_block_data=yes
bx=8
by=8

# amr refine criterion use at init condition
# possible value: ALWAYS_REFINE, GEOMETRIC, SAME_AS_REGULAR_DYNAMICS
refine_criterion_at_init=GEOMETRIC

# init step may contain calls to globalRefine
# if the following option is true, we interleave
# calls to load balancing in between globalRefine
# if the following option is false, a single load
# balancing operation is done at the end of
# globalRefine steps
enable_load_balance_during_init=false

# refine criterion (used during regular dynamics)
# example parameter for using LOHNER_UNSPLIT criterion
refine_criterion=LOHNER_UNSPLIT
epsilon_refine=0.4
epsilon_coarsen=0.05
epsilon_lohner=0.02

# example parameter for using LOHNER_UNSPLIT criterion
#refine_criterion=SIMPLE_GRADIENT
#epsilon_refine=0.1
#epsilon_coarsen=0.01

# p4est connectivity type
connectivity=brick

# control MPI load balancing (number of time steps between two
# consecutive load balancing)
load_balancing_frequency=20

# control AMR cycle frequency (number of time steps between two
# consecutive AMR cycles)
cycle_frequency=10

#
# when using two AMR refinement criterion (one for init conditions,
# one of the rest of the simulation run), we may want to disable the first amr cycle
# to smooth the transition between the two AMR criterion.
#
disable_first_amr_cycle=yes

#time_integrator=RK2_SSP

#
# Refine criterion
#
variable_used_to_compute_refine_criterion=alpha_rho_0,vx,thermal_pressure

[p4est_connectivity]
nbrick_x=4
nbrick_y=1

periodic_x=0
periodic_y=0

[mesh]
xmin=0.0
ymin=0.0

scaling_factor=0.25

boundary_type_xmin=ZERO_GRADIENT
boundary_type_xmax=ZERO_GRADIENT

boundary_type_ymin=ZERO_GRADIENT
boundary_type_ymax=ZERO_GRADIENT

[THINC]
enabled=yes
beta=1.5
epsilon=1e-3

[hydro]
cfl=0.8
slope_type=1
problem=two_fluid_shock_tube
riemann=HLLC

[material0]
name=lx17
mg_eos_name=MG_JWL

[material0_mie_gruneisen_jwl]
# note: A1 and A2 are given in Pascal
rho0=1905
Gamma0=0.8938
A1=6.321e13
A2=-4.472e9
R1=11.3
R2=1.13
e0=0.0

[material1]
mg_eos_name=MG_JWL

[material1_mie_gruneisen_jwl]
# note: A1 and A2 are given in Pascal
rho0=1905
Gamma0=0.8938
A1=6.321e13
A2=-4.472e9
R1=11.3
R2=1.13
e0=0.0


[region0]
#alpha_rho=4000.0,0.0
alpha0=1.0
alpha_rho=952.5,0.0
p=100e9
u=0.0

[region1]
alpha0=0.0
alpha_rho=0.0,3810.0
p=200e9
u=0.0

[two_fluid_shock_tube]
# discontinuity location default to center box, i.e. (x_min + x_max) / 2
# but you can change it by setting xd
xd=0.5

[output]
outputDir=./
outputPrefix=test_two_fluid_shock_tube_2d_lx17_jwl
outputVtkAscii=false
write_variables=rho_mix,alpha_rho_0,alpha_rho_1,alpha_0,rho_vx,rho_vy,vx,e_tot,thermal_pressure
write_mesh_info=yes
write_iOct=no
hdf5_enabled=yes
enable_writing_leaf_data=no
write_conformal_status=no
